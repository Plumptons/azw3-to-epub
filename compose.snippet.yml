# Paste this service into your media-PC MAIN compose (same stack as
# bindery / storyteller / readarrbookshelf — not a separate tools compose).
# Pulls the prebuilt image from GHCR — no local git clone/build required.
#
# First pull (if the package is private):
#   echo YOUR_GITHUB_PAT | docker login ghcr.io -u Plumptons --password-stdin
#
# Put secrets in that folder's .env (placeholders only in git):
#   BINDERY_API_KEY=
#   STORYTELLER_USERNAME=
#   STORYTELLER_PASSWORD=
#   JELLYFIN_API_KEY=   (optional — pause readaloud while Jellyfin is playing)
#   SONARR_API_KEY= / RADARR_API_KEY=  (optional — watched episode/movie cleanup)
# Also for the Storyteller service itself (rotate if ever pasted live):
#   STORYTELLER_SECRET_KEY=
#
# Reachability: Docker DNS hostnames on this compose network
# (http://bindery:8787, http://storyteller:8001) — not LAN/M:-only.
# Books: Bindery and ReadarrBookshelf both remain; this tool is Bindery-facing
# for ebook-link hygiene and must stay dual-compatible with the stack.
#
# Safety: DELETE_SOURCE stays false. Wanted search / queue clear / audio probe
# are off by default. Set FOLDER_COALESCE_DRY_RUN=true for a no-write coalesce report.

  azw3-to-epub:
    image: ghcr.io/plumptons/azw3-to-epub:latest
    container_name: azw3-to-epub
    user: "0:0"
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
      LIBRARY_DIR: /media/books
      DELETE_SOURCE: "false"
      INITIAL_SCAN: "true"
      RESCAN_INTERVAL: "120"
      BINDERY_URL: http://bindery:8787
      BINDERY_API_KEY: ${BINDERY_API_KEY}
      BINDERY_SYNC: "true"
      BINDERY_LIBRARY_DIR: /media/books
      BINDERY_WANTED_SEARCH: "false"
      BINDERY_CLEAR_QUEUE: "false"
      BINDERY_AUDIO_PROBE: "false"
      FOLDER_COALESCE: "true"
      FOLDER_COALESCE_INTERVAL: "300"
      FOLDER_COALESCE_DRY_RUN: ${FOLDER_COALESCE_DRY_RUN:-false}
      STORYTELLER_URL: http://storyteller:8001
      STORYTELLER_USERNAME: ${STORYTELLER_USERNAME}
      STORYTELLER_PASSWORD: ${STORYTELLER_PASSWORD}
      STORYTELLER_AUTO_MERGE: "true"
      STORYTELLER_MERGE_INTERVAL: "300"
      STORYTELLER_AUTO_READALOUD: "true"
      STORYTELLER_READALOUD_START: "00:01"
      STORYTELLER_READALOUD_END: "06:00"
      STORYTELLER_READALOUD_INTERVAL: "1800"
      STORYTELLER_READALOUD_LIMIT: "1"
      STORYTELLER_SYNC_SERIES: "true"
      STORYTELLER_SERIES_INTERVAL: "3600"
      STORYTELLER_SYNC_DESCRIPTIONS: "true"
      STORYTELLER_DESCRIPTIONS_INTERVAL: "3600"
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_PAUSE_READALOUD: ${JELLYFIN_PAUSE_READALOUD:-true}
      JELLYFIN_PLAYBACK_CHECK_INTERVAL: ${JELLYFIN_PLAYBACK_CHECK_INTERVAL:-60}
      # Opt-in watched cleanup (episode/movie file delete + unmonitor; not whole series)
      WATCHED_CLEANUP: ${WATCHED_CLEANUP:-false}
      WATCHED_CLEANUP_DRY_RUN: ${WATCHED_CLEANUP_DRY_RUN:-true}
      WATCHED_CLEANUP_INTERVAL: ${WATCHED_CLEANUP_INTERVAL:-3600}
      WATCHED_CLEANUP_GRACE_HOURS: ${WATCHED_CLEANUP_GRACE_HOURS:-24}
      WATCHED_CLEANUP_TYPES: ${WATCHED_CLEANUP_TYPES:-Episode,Movie}
      SONARR_URL: ${SONARR_URL:-http://sonarr:8989}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-http://radarr:7878}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      EPUB_VERSION: "3"
    volumes:
      - M:/media:/media
