# Drop-in AZW3 → EPUB converter for the media PC (main compose, not a tools compose).
#
# Best: paste compose.snippet.yml into the same stack as bindery/storyteller/
# readarrbookshelf so Docker DNS resolves:
#   BINDERY_URL=http://bindery:8787
#   STORYTELLER_URL=http://storyteller:8001
#
# Paths mirror Bindery:
#   BINDERY_LIBRARY_DIR=/media/books
#   volumes: M:/media:/media
#
# Safety: DELETE_SOURCE defaults false; queue clear never passes deleteFiles;
# FOLDER_COALESCE_DRY_RUN=true logs coalesce work without filesystem changes.
# See README.md for the full dry-run / never-delete contracts.
#
# Tip: point Storyteller's auto-import folder at /media/books so new ebook+audio
# pairs in the same Bindery folder are matched on import (API merge covers orphans).

services:
  azw3-to-epub:
    # Prefer the published image; fall back to a local build when developing.
    image: ${AZW3_IMAGE:-ghcr.io/plumptons/azw3-to-epub:latest}
    build:
      context: ./azw3-to-epub
      dockerfile: Dockerfile
    container_name: azw3-to-epub
    user: "${PUID:-0}:${PGID:-0}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      LIBRARY_DIR: /media/books
      DELETE_SOURCE: ${DELETE_SOURCE:-false}
      INITIAL_SCAN: ${INITIAL_SCAN:-true}
      RESCAN_INTERVAL: ${RESCAN_INTERVAL:-120}
      STABLE_SECONDS: ${STABLE_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BINDERY_URL: ${BINDERY_URL:-http://bindery:8787}
      BINDERY_API_KEY: ${BINDERY_API_KEY:-}
      BINDERY_SYNC: ${BINDERY_SYNC:-true}
      BINDERY_LIBRARY_DIR: ${BINDERY_LIBRARY_DIR:-/media/books}
      # Opt-in Bindery helpers (off by default — use Bindery's own scheduler)
      BINDERY_WANTED_SEARCH: ${BINDERY_WANTED_SEARCH:-false}
      BINDERY_SEARCH_INTERVAL: ${BINDERY_SEARCH_INTERVAL:-3600}
      BINDERY_CLEAR_QUEUE: ${BINDERY_CLEAR_QUEUE:-false}
      BINDERY_CLEAR_QUEUE_INTERVAL: ${BINDERY_CLEAR_QUEUE_INTERVAL:-300}
      BINDERY_AUDIO_PROBE: ${BINDERY_AUDIO_PROBE:-false}
      BINDERY_AUDIO_PROBE_INTERVAL: ${BINDERY_AUDIO_PROBE_INTERVAL:-3600}
      BINDERY_AUDIO_PROBE_LIMIT: ${BINDERY_AUDIO_PROBE_LIMIT:-5}
      BINDERY_AUDIO_PROBE_COOLDOWN: ${BINDERY_AUDIO_PROBE_COOLDOWN:-604800}
      FOLDER_COALESCE: ${FOLDER_COALESCE:-true}
      FOLDER_COALESCE_INTERVAL: ${FOLDER_COALESCE_INTERVAL:-300}
      FOLDER_COALESCE_DRY_RUN: ${FOLDER_COALESCE_DRY_RUN:-false}
      STORYTELLER_URL: ${STORYTELLER_URL:-http://storyteller:8001}
      STORYTELLER_USERNAME: ${STORYTELLER_USERNAME:-}
      STORYTELLER_PASSWORD: ${STORYTELLER_PASSWORD:-}
      STORYTELLER_AUTO_MERGE: ${STORYTELLER_AUTO_MERGE:-true}
      STORYTELLER_MERGE_INTERVAL: ${STORYTELLER_MERGE_INTERVAL:-300}
      STORYTELLER_MERGE_DELAY: ${STORYTELLER_MERGE_DELAY:-15}
      STORYTELLER_AUTO_READALOUD: ${STORYTELLER_AUTO_READALOUD:-true}
      STORYTELLER_READALOUD_START: ${STORYTELLER_READALOUD_START:-00:01}
      STORYTELLER_READALOUD_END: ${STORYTELLER_READALOUD_END:-06:00}
      STORYTELLER_READALOUD_INTERVAL: ${STORYTELLER_READALOUD_INTERVAL:-1800}
      STORYTELLER_READALOUD_LIMIT: ${STORYTELLER_READALOUD_LIMIT:-1}
      STORYTELLER_SYNC_SERIES: ${STORYTELLER_SYNC_SERIES:-true}
      STORYTELLER_SERIES_INTERVAL: ${STORYTELLER_SERIES_INTERVAL:-3600}
      STORYTELLER_SYNC_DESCRIPTIONS: ${STORYTELLER_SYNC_DESCRIPTIONS:-true}
      STORYTELLER_DESCRIPTIONS_INTERVAL: ${STORYTELLER_DESCRIPTIONS_INTERVAL:-3600}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_PAUSE_READALOUD: ${JELLYFIN_PAUSE_READALOUD:-true}
      JELLYFIN_PLAYBACK_CHECK_INTERVAL: ${JELLYFIN_PLAYBACK_CHECK_INTERVAL:-60}
      WATCHED_CLEANUP: ${WATCHED_CLEANUP:-false}
      WATCHED_CLEANUP_DRY_RUN: ${WATCHED_CLEANUP_DRY_RUN:-true}
      WATCHED_CLEANUP_INTERVAL: ${WATCHED_CLEANUP_INTERVAL:-3600}
      WATCHED_CLEANUP_GRACE_HOURS: ${WATCHED_CLEANUP_GRACE_HOURS:-24}
      WATCHED_CLEANUP_TYPES: ${WATCHED_CLEANUP_TYPES:-Episode,Movie}
      SONARR_URL: ${SONARR_URL:-http://sonarr:8989}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-http://radarr:7878}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      EPUB_VERSION: ${EPUB_VERSION:-3}
    volumes:
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}:/media
